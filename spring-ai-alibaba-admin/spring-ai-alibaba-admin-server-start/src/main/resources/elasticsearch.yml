#Elasticsearch configuration file
spring:
  elasticsearch:
    #Elasticsearch service address
    #Supports overriding through the environment variable SPRING_ELASTICSEARCH_URL, the default value is for local development
    url: ${SPRING_ELASTICSEARCH_URL:http://localhost:9200}
    #Connection timeout (milliseconds)
    connect-timeout: 5000
    #Read timeout (milliseconds)
    socket-timeout: 60000
    #Connection pool configuration
    connection-pool:
      #Maximum number of connections
      max-connections: 100
      #Maximum number of idle connections
      max-idle-connections: 50
      #Connection keepalive time (milliseconds)
      keep-alive: 300000
#Application tracking configuration
app:
  tracing:
    #Index configuration
    index:
      #traces index name
      traces-index: loongsuite_traces
      #Number of index shards
      shards: 1
      #Number of index copies
      replicas: 0
