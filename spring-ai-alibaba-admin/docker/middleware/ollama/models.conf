# ============================================================
# Ollama Models to Pull
# ============================================================
# One model per line.  Blank lines and lines starting with '#'
# are ignored.
#
# Format:  <model_name>
#
# All models listed here are open-source and commercially
# free to use (Apache 2.0 / MIT / permissive community licenses).
#
# To add a new model:
#   1. Add a line here
#   2. (Optional) Add a matching row to the PostgreSQL init SQL
#      so the UI shows it in Model Configuration on first boot
#   3. Run:  docker compose -f docker-compose-arm.yaml run --rm ollama-init
#
# When migrating to a new server:
#   1. Copy the entire  ollama/data/  directory to the new host
#   2. Copy this file
#   3. Models are already local — no re-download needed
#
# Total disk: ~36 GB
# ============================================================

