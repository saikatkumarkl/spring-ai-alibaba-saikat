version: '3.8'

services:
  postgres:
    container_name: postgres
    restart: always
    image: postgres:15
    platform: linux/amd64
    environment:
      - POSTGRES_DB=admin
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - TZ=Asia/Shanghai
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin -h localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - cordondata-network

  # ============================
  # OpenSearch (RAG-ready) + UI
  # ============================

  opensearch:
    image: opensearchproject/opensearch:3.4.0
    container_name: opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - http.cors.enabled=true
      - http.cors.allow-origin=*
      - action.destructive_requires_name=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cordondata-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.4.0
    container_name: opensearch-dashboards
    restart: always
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - cordondata-network

  nacos:
    container_name: nacos
    restart: always
    image: nacos/nacos-server:v2.3.0
    platform: linux/amd64
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    volumes:
      - ./nacos/logs:/home/nacos/logs
      - ./nacos/data:/home/nacos/data
    networks:
      - cordondata-network

  redis:
    restart: always
    image: redis:7.2.5
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - cordondata-network

  rmq-namesrv:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    container_name: rmq-namesrv
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - NAMESRV_ADDR=rmq-namesrv:9876
      - HEAP_OPTS=-Xms128M -Xmx256M -Xmn128M
    ports:
      - "9876:9876"
    networks:
      - cordondata-network
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep mqnamesrv | grep -v grep || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  rmq-broker:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    container_name: rmq-broker
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - NAMESRV_ADDR=rmq-namesrv:9876
      - HEAP_OPTS=-Xms256M -Xmx512M -Xmn256M -XX:MaxDirectMemorySize=128M
    volumes:
      - ./rocketmq/store:/home/rocketmq/store
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    depends_on:
      rmq-namesrv:
        condition: service_healthy
    networks:
      - cordondata-network
    command: sh mqbroker
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep mqbroker | grep -v grep || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  rmq-proxy:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    container_name: rmq-proxy
    restart: always
    volumes:
      - ./conf/rocketmq:/home/rocketmq/conf
    environment:
      - TZ=Asia/Shanghai
      - NAMESRV_ADDR=rmq-namesrv:9876
      - HEAP_OPTS=-Xms128M -Xmx256M -Xmn128M
    networks:
      - cordondata-network
    depends_on:
      rmq-broker:
        condition: service_healthy
      rmq-namesrv:
        condition: service_healthy
    ports:
      - "18080:18080"
      - "18081:18081"
    command: sh mqproxy -pc /home/rocketmq/conf/rmq-proxy.json

  init-topic:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    container_name: rmq-init-topic
    restart: "no"
    depends_on:
      rmq-namesrv:
        condition: service_healthy
      rmq-broker:
        condition: service_healthy
    networks:
      - cordondata-network
    entrypoint: >
      sh -c "
        echo 'Waiting for RocketMQ to be ready...' &&
        sleep 30 &&
        until sh mqadmin clusterList -n rmq-namesrv:9876; do
          echo 'Waiting for RocketMQ to be fully ready...' &&
          sleep 10
        done &&
        echo 'Creating topic...' &&
        sh mqadmin updateTopic -n rmq-namesrv:9876 -t topic_cordondata_document_index -c DefaultCluster -a +message.type=NORMAL &&
        sh mqadmin updateSubGroup -n rmq-namesrv:9876 -g group_cordondata_document_index -c DefaultCluster &&
        echo 'Verifying topic creation.' &&
        sh mqadmin topicList -n rmq-namesrv:9876 &&
        echo 'Topic creation completed'"

  # ============================
  # Ollama (Local LLM + Embedding)
  # Commented out — using remote Ollama instance
  # ============================

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: always
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama/data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12
  #     start_period: 15s
  #   networks:
  #     - cordondata-network

  # ollama-init:
  #   image: ollama/ollama:latest
  #   container_name: ollama-init
  #   restart: "no"
  #   volumes:
  #     - ./ollama/data:/root/.ollama
  #     - ./ollama/models.conf:/models.conf:ro
  #   entrypoint: >
  #     sh -c "
  #       ... (model pull/cleanup logic)
  #     "
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   networks:
  #     - cordondata-network

  # ============================
  # Keycloak (Identity & Access Management)
  # ============================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: always
    ports:
      - "8180:8080"
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=admin
      - KC_DB_PASSWORD=admin
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev --import-realm --health-enabled=true
    volumes:
      - ./keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - cordondata-network

  backend:
    build:
      context: ../..
      dockerfile: docker/middleware/Dockerfile.backend
    image: cordondata-admin-server:latest
    container_name: cordondata-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseG1GC
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/admin
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_DATABASE=0
      - SPRING_ELASTICSEARCH_URL=http://opensearch:9200
      - SPRING_ELASTICSEARCH_URIS=http://opensearch:9200
      - NACOS_SERVER_ADDR=nacos:8848
      - ROCKETMQ_ENDPOINTS=rmq-proxy:18081
      # Ollama model names (the endpoint URL is configured via Settings UI
      # or the seed file model-config-ollama.yml, NOT via env vars)
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # model-config.yml is mounted at /app/model-config.yml
      - MODEL_CONFIG_FILE=/app/model-config.yml
      # ManifoldCF API credentials (must match properties.xml apilogin settings)
      - MANIFOLDCF_API_URL=http://manifoldcf:8345/mcf-api-service
      - MANIFOLDCF_API_USERNAME=${MCF_API_USERNAME:-admin}
      - MANIFOLDCF_API_PASSWORD=${MCF_API_PASSWORD:-admin}
      # OpenSearch URL as seen by ManifoldCF (Docker internal network)
      - MANIFOLDCF_OPENSEARCH_URL=http://opensearch:9200/
      # ── RAG Vector Storage ──────────────────────────────────────────────
      # Controls how knn_vector embeddings are stored in OpenSearch.
      #
      # Pick a profile based on your hardware:
      #
      # ┌─────────────────┬──────────────┬────────────────────┬───────────────────────────────────┐
      # │ Profile         │ VECTOR_MODE  │ COMPRESSION_LEVEL  │ When to use                       │
      # ├─────────────────┼──────────────┼────────────────────┼───────────────────────────────────┤
      # │ Low-RAM / Edge  │ on_disk      │ 32x                │ ≤8 GB RAM, no GPU, ARM SBC,       │
      # │                 │              │                    │ large corpus (>100k docs)          │
      # │                 │              │                    │ ~32x RAM savings, auto-rescore     │
      # ├─────────────────┼──────────────┼────────────────────┼───────────────────────────────────┤
      # │ Balanced        │ on_disk      │ 16x                │ 16–32 GB RAM, no GPU              │
      # │                 │              │                    │ Better recall than 32x, still      │
      # │                 │              │                    │ significant RAM savings             │
      # ├─────────────────┼──────────────┼────────────────────┼───────────────────────────────────┤
      # │ High-RAM        │ in_memory    │ (leave empty)      │ ≥32 GB RAM or GPU-accelerated     │
      # │                 │              │                    │ Full-precision vectors in RAM       │
      # │                 │              │                    │ Fastest search, highest quality     │
      # ├─────────────────┼──────────────┼────────────────────┼───────────────────────────────────┤
      # │ Default         │ (leave empty)│ (leave empty)      │ Let OpenSearch pick engine defaults│
      # └─────────────────┴──────────────┴────────────────────┴───────────────────────────────────┘
      #
      # Examples:
      #   Low-RAM:    RAG_VECTOR_MODE=on_disk   RAG_COMPRESSION_LEVEL=32x
      #   Balanced:   RAG_VECTOR_MODE=on_disk   RAG_COMPRESSION_LEVEL=16x
      #   High-RAM:   RAG_VECTOR_MODE=in_memory RAG_COMPRESSION_LEVEL=
      #
      # NOTE: Changing these requires re-indexing (delete the _rag index, then re-sync).
      - RAG_VECTOR_MODE=${RAG_VECTOR_MODE:-on_disk}
      - RAG_COMPRESSION_LEVEL=${RAG_COMPRESSION_LEVEL:-32x}
      # Keycloak SSO
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_PUBLIC_URL=http://localhost:8180
      - KEYCLOAK_REALM=cordondata
      - KEYCLOAK_ENABLED=true
    volumes:
      - ./model-config-ollama.yml:/app/model-config.yml:ro
      - cordondata_storage:/home/spring/cordondata/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rmq-proxy:
        condition: service_started
      # ollama:  # Commented out — using remote Ollama
      #   condition: service_healthy
    networks:
      - cordondata-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  manifoldcf:
    build:
      context: ../../../manifoldcf-saikat
      dockerfile: Dockerfile.maven
    image: manifoldcf-saikat:latest
    platform: linux/amd64
    container_name: manifoldcf
    restart: always
    environment:
      - JAVA_OPTS=-Xms512m -Xmx512m
      - MCF_OPENSEARCH_URL=http://opensearch:9200
    ports:
      - "8345:8345"
    volumes:
      - ./manifoldcf/config/properties.xml:/usr/share/manifoldcf/example/properties.xml:ro
      - ./manifoldcf/config/logging.xml:/usr/share/manifoldcf/example/logging.xml:ro
      - ./manifoldcf/config/jetty.xml:/usr/share/manifoldcf/example/jetty.xml:ro
      - ./manifoldcf/config/start-options.env.unix:/usr/share/manifoldcf/example/start-options.env.unix:ro
      - ./manifoldcf/logs:/usr/share/manifoldcf/example/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "-u", "admin:admin", "http://localhost:8345/mcf-api-service/json/outputconnectors"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - cordondata-network

  manifoldcf-init:
    image: curlimages/curl:8.5.0
    container_name: manifoldcf-init
    restart: "no"
    volumes:
      - ./manifoldcf/config/init-opensearch-output.sh:/init-opensearch-output.sh:ro
    entrypoint: ["/bin/sh", "/init-opensearch-output.sh"]
    environment:
      - MCF_API_URL=http://manifoldcf:8345/mcf-api-service
      - MCF_API_USER=${MCF_API_USERNAME:-admin}
      - MCF_API_PASS=${MCF_API_PASSWORD:-admin}
      # OpenSearch output
      - OPENSEARCH_URL=http://opensearch:9200/
      # Alfresco CMIS repository (set credentials before deploying)
      - CMIS_USERNAME=${CMIS_USERNAME:-CHANGE_ME_USERNAME}
      - CMIS_PASSWORD=${CMIS_PASSWORD:-CHANGE_ME_PASSWORD}
      - CMIS_PROTOCOL=https
      - CMIS_SERVER=alfresco-demo.crestsolution.com
      - CMIS_PORT=8080
      - CMIS_PATH=/alfresco/api/-default-/cmis/versions/1.1/atom
      - CMIS_BINDING=atom
      - CMIS_REPOSITORY_ID=-default-
      # CMIS vendor + group API (for authorities sync)
      - CMIS_VENDOR=alfresco
      - CMIS_GROUP_API_URL=/alfresco/api/-default-/public/alfresco/versions/1/groups
      - CMIS_GROUP_MEMBERS_API_URL=/alfresco/api/-default-/public/alfresco/versions/1/groups/{groupId}/members
      # Skip ACL wait — set "true" to skip waiting for authorities index
      - SKIP_ACL_WAIT=false
      # Max file size in MB — files larger than this are skipped (0 = no limit)
      - MAX_FILE_SIZE_MB=0
      # Cron schedule for incremental crawl (default: every 6 hours)
      - CRAWL_CRON_MINUTE=0
      - CRAWL_CRON_HOUR=*/6
      # Recrawl interval in ms (6 hours)
      - RECRAWL_INTERVAL_MS=21600000
    depends_on:
      manifoldcf:
        condition: service_healthy
    networks:
      - cordondata-network

  # ============================
  # Chatbot Backend (Spring Boot)
  # ============================
  chatbot-backend:
    build:
      context: ./chatbot
      dockerfile: Dockerfile.backend
    container_name: chatbot-backend
    restart: always
    environment:
      - SERVER_PORT=8081
      - ADMIN_API_BASE_URL=http://backend:8080
      - KEYCLOAK_ENABLED=true
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_PUBLIC_URL=http://localhost:8180
      - KEYCLOAK_REALM=cordondata
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/chatui/index.html"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    networks:
      - cordondata-network

  # ============================
  # Chatbot Frontend (React / Nginx)
  # ============================
  chatbot-frontend:
    build:
      context: ../../../../spring-ai-alibaba-saikat-chata/frontend
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - chatbot-backend
    networks:
      - cordondata-network

volumes:
  opensearch_data:
    driver: local
  cordondata_storage:
    driver: local

networks:
  cordondata-network:
    driver: bridge