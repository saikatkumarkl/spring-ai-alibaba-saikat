  postgres:
    container_name: postgres
    restart: always
    image: postgres:15
    platform: linux/amd64
    environment:
      - POSTGRES_DB=admin
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - TZ=Asia/Shanghai
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin -h localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - saa-network

  # ============================
  # OpenSearch (RAG-ready) + UI
  # ============================

  opensearch:
    image: opensearchproject/opensearch:3.4.0
    container_name: opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - http.cors.enabled=true
      - http.cors.allow-origin=*
      - action.destructive_requires_name=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - saa-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.4.0
    container_name: opensearch-dashboards
    restart: always
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - saa-network

  nacos:
    container_name: nacos
    restart: always
    image: nacos/nacos-server:v2.3.0
    platform: linux/amd64
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    volumes:
      - ./nacos/logs:/home/nacos/logs
      - ./nacos/data:/home/nacos/data
    networks:
      - saa-network

  redis:
    restart: always
    image: redis:7.2.5
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - saa-network

  rmq-namesrv:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    container_name: rmq-namesrv
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - NAMESRV_ADDR=rmq-namesrv:9876
      - HEAP_OPTS=-Xms128M -Xmx256M -Xmn128M
    ports:
      - "9876:9876"
    networks:
      - saa-network
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep mqnamesrv | grep -v grep || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  rmq-broker:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    container_name: rmq-broker
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - NAMESRV_ADDR=rmq-namesrv:9876
      - HEAP_OPTS=-Xms256M -Xmx512M -Xmn256M -XX:MaxDirectMemorySize=128M
    volumes:
      - ./rocketmq/store:/home/rocketmq/store
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    depends_on:
      rmq-namesrv:
        condition: service_healthy
    networks:
      - saa-network
    command: sh mqbroker
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep mqbroker | grep -v grep || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  rmq-proxy:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    container_name: rmq-proxy
    restart: always
    volumes:
      - ./conf/rocketmq:/home/rocketmq/conf
    environment:
      - TZ=Asia/Shanghai
      - NAMESRV_ADDR=rmq-namesrv:9876
      - HEAP_OPTS=-Xms128M -Xmx256M -Xmn128M
    networks:
      - saa-network
    depends_on:
      rmq-broker:
        condition: service_healthy
      rmq-namesrv:
        condition: service_healthy
    ports:
      - "18080:18080"
      - "18081:18081"
    command: sh mqproxy -pc /home/rocketmq/conf/rmq-proxy.json

  init-topic:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    container_name: rmq-init-topic
    restart: "no"
    depends_on:
      rmq-namesrv:
        condition: service_healthy
      rmq-broker:
        condition: service_healthy
    networks:
      - saa-network
    entrypoint: >
      sh -c "
        echo 'Waiting for RocketMQ to be ready...' &&
        sleep 30 &&
        until sh mqadmin clusterList -n rmq-namesrv:9876; do
          echo 'Waiting for RocketMQ to be fully ready...' &&
          sleep 10
        done &&
        echo 'Creating topic...' &&
        sh mqadmin updateTopic -n rmq-namesrv:9876 -t topic_saa_studio_document_index -c DefaultCluster -a +message.type=NORMAL &&
        sh mqadmin updateSubGroup -n rmq-namesrv:9876 -g group_saa_studio_document_index -c DefaultCluster &&
        echo 'Verifying topic creation.' &&
        sh mqadmin topicList -n rmq-namesrv:9876 &&
        echo 'Topic creation completed'"

  backend:
    build:
      context: ../..
      dockerfile: docker/middleware/Dockerfile.backend
    image: spring-ai-alibaba-admin-server:latest
    container_name: saa-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseG1GC
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/admin
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_DATABASE=0
      - SPRING_ELASTICSEARCH_URL=http://opensearch:9200
      - SPRING_ELASTICSEARCH_URIS=http://opensearch:9200
      - NACOS_SERVER_ADDR=nacos:8848
      - ROCKETMQ_ENDPOINTS=rmq-proxy:18081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rmq-proxy:
        condition: service_started
    networks:
      - saa-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  manifoldcf:
    build:
      context: ../../../manifoldcf-saikat
      dockerfile: Dockerfile.maven
    image: manifoldcf-saikat:latest
    platform: linux/amd64
    container_name: manifoldcf
    restart: always
    environment:
      - JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "8345:8345"
    volumes:
      - ./manifoldcf/config/properties.xml:/usr/share/manifoldcf/example/properties.xml:ro
      - ./manifoldcf/config/logging.xml:/usr/share/manifoldcf/example/logging.xml:ro
      - ./manifoldcf/config/jetty.xml:/usr/share/manifoldcf/example/jetty.xml:ro
      - ./manifoldcf/config/start-options.env.unix:/usr/share/manifoldcf/example/start-options.env.unix:ro
      - ./manifoldcf/logs:/usr/share/manifoldcf/example/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8345/mcf-api-service/json/outputconnectors"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - saa-network

  manifoldcf-init:
    image: curlimages/curl:8.5.0
    container_name: manifoldcf-init
    restart: "no"
    volumes:
      - ./manifoldcf/config/init-opensearch-output.sh:/init-opensearch-output.sh:ro
    entrypoint: ["/bin/sh", "/init-opensearch-output.sh"]
    environment:
      - MCF_API_URL=http://manifoldcf:8345/mcf-api-service
      # OpenSearch output
      - OPENSEARCH_URL=http://opensearch:9200/
      - OPENSEARCH_INDEX=manifoldcf
      # Alfresco CMIS repository (set credentials before deploying)
      - CMIS_USERNAME=${CMIS_USERNAME:-CHANGE_ME_USERNAME}
      - CMIS_PASSWORD=${CMIS_PASSWORD:-CHANGE_ME_PASSWORD}
      - CMIS_PROTOCOL=https
      - CMIS_SERVER=alfresco-demo.crestsolution.com
      - CMIS_PORT=8080
      - CMIS_PATH=/alfresco/api/-default-/cmis/versions/1.1/atom
      - CMIS_BINDING=atom
      - CMIS_REPOSITORY_ID=-default-
    depends_on:
      manifoldcf:
        condition: service_healthy
    networks:
      - saa-network

volumes:
  opensearch_data:
    driver: local

networks:
  saa-network:
    driver: bridge