#MySQL initialization script ConfigMap
#This ConfigMap contains the database initialization SQL script
#When the MySQL container starts, this ConfigMap will be mounted to the /docker-entrypoint-initdb.d directory.
#MySQL official image will automatically execute all .sql files in this directory when initializing the database for the first time.
#
#How to use:
#1. Execute from the project root directory: kubectl apply -f deploy/middleware/mysql/mysql-init-configmap.yaml
#2. Or use the kubectl create command (recommended, it can be automatically created from a file):
#    kubectl create configmap mysql-init-scripts \
#      --from-file=admin-schema.sql=docker/middleware/init/mysql/admin-schema.sql \
#      --from-file=agentscope-schema.sql=docker/middleware/init/mysql/agentscope-schema.sql \
#      -n spring-ai-admin \
#      --dry-run=client -o yaml | kubectl apply -f -
#
#Notice:
#- This ConfigMap must be created before deploying MySQL Deployment
#- If MySQL has already been initialized, creating the ConfigMap again will not re-execute the script.
#- If reinitialization is required, MySQL PVC and data need to be deleted
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-scripts
  namespace: spring-ai-admin
data:
  #Note: You need to manually paste the contents of the SQL file here, or use the kubectl create command above
  #Because ConfigMap cannot directly reference external file paths
  admin-schema.sql: |
    #Please use the kubectl create command to create from a file instead of using this YAML directly
    #Or paste the contents of docker/middleware/init/mysql/admin-schema.sql here
  agentscope-schema.sql: |
    #Please use the kubectl create command to create from a file instead of using this YAML directly
    #Or paste the contents of docker/middleware/init/mysql/agentscope-schema.sql here
