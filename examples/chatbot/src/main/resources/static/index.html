<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f7;
            background-image:
                radial-gradient(ellipse 80% 60% at 20% 30%, rgba(88, 86, 214, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 70%, rgba(0, 122, 255, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(175, 82, 222, 0.06) 0%, transparent 70%);
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            padding: 44px 40px 36px;
            border-radius: 18px;
            border: 0.5px solid rgba(0, 0, 0, 0.08);
            box-shadow:
                0 0 0 0.5px rgba(0, 0, 0, 0.04),
                0 8px 40px rgba(0, 0, 0, 0.08),
                0 2px 8px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #007AFF, #5856D6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        h1 {
            text-align: center;
            color: #1d1d1f;
            margin-bottom: 6px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            text-align: center;
            color: #86868b;
            margin-bottom: 32px;
            font-size: 14px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #1d1d1f;
            font-weight: 500;
            font-size: 13px;
            letter-spacing: -0.01em;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 0.5px solid rgba(0, 0, 0, 0.12);
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            background: rgba(255, 255, 255, 0.8);
            color: #1d1d1f;
        }

        input:focus {
            outline: none;
            border-color: #007AFF;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12);
            background: #fff;
        }

        input::placeholder {
            color: #c7c7cc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
            letter-spacing: -0.01em;
        }

        button:hover:not(:disabled) {
            background: #0066d6;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
        }

        button:active:not(:disabled) {
            background: #004ba0;
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            background: rgba(255, 59, 48, 0.08);
            color: #FF3B30;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
            border-left: 3px solid #FF3B30;
            font-weight: 500;
        }

        .error.show {
            display: block;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .info {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 0.5px solid rgba(0, 0, 0, 0.08);
            font-size: 12px;
            color: #86868b;
            line-height: 1.7;
        }

        .info strong {
            display: block;
            margin-bottom: 6px;
            color: #1d1d1f;
            font-size: 13px;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-icon">🤖</div>
        <h1>Knowledge Hub</h1>
        <p class="subtitle">Sign in to access AI-powered conversations</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Username</label>
                <input 
                    type="text" 
                    id="email" 
                    name="email" 
                    required 
                    autofocus
                    placeholder="afc-it-user"
                    autocomplete="username"
                >
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >
            </div>
            
            <button type="submit" id="loginBtn">
                <span id="btnText">Sign In</span>
            </button>
            
            <div class="error" id="error"></div>
        </form>
        
        <div class="info">
            <strong>Getting Started</strong>
            Sign in with your username. New users are auto-provisioned on first login.<br>
            <strong>Demo Account:</strong> afc-it-user / afc12345
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('error');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 5000);
        }

        function hideError() {
            errorDiv.classList.remove('show');
        }

        function setLoading(loading) {
            loginBtn.disabled = loading;
            if (loading) {
                btnText.innerHTML = 'Signing in<span class="spinner"></span>';
            } else {
                btnText.textContent = 'Sign In';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            setLoading(true);
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success && data.data && data.data.token) {
                    // Login successful - redirect to chat
                    console.log('Login successful for:', data.data.email);
                    window.location.href = '/chat.html';
                } else {
                    showError(data.message || 'Invalid username or password');
                    setLoading(false);
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Login failed. Please check if the Admin backend is running.');
                setLoading(false);
            }
        });

        // Auto-fill demo credentials on page load (for development)
        if (window.location.hostname === 'localhost') {
            emailInput.value = 'afc-it-user';
            passwordInput.value = 'afc12345';
        }
    </script>
</body>
</html>
